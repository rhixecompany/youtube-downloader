[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "youtube-downloader"
description = "YouTube video/audio CLI downloader using yt-dlp"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
version = "0.1.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]
keywords = ["youtube", "downloader", "video", "cli", "yt-dlp"]

[project.scripts]
youtube-downloader = "main_noplaylist:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.15",
    "mypy>=1.0",
    "pytest>=8.0",
    "pytest-sugar",
    "pre-commit",
]

[project.urls]
Homepage = "https://github.com/rhixecompany/sandbox"
Issues = "https://github.com/rhixecompany/sandbox/issues"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/main_*.py", "/youtube-downloader.*", "/README.md", "/LICENSE", "/docs/"]

[tool.ruff]
line-length = 120
select = ["E", "F", "I", "W", "N", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

# Note: this package uses hatchling (modern, fast, zero-config build backend).
# Design tokens (design.md) and CLI formatting conventions are preserved.
# See docs/design.md for formatting tokens referenced by main_*.py and wrapper scripts.

name: CI
on:
  push:
    branches: [development, production]
  pull_request:
    branches: [development]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff yt-dlp
      - run: ruff check .
      - run: python test.py
